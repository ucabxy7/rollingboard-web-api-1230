services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ${APP_NAME}-api-dev
    container_name: ${APP_NAME}-api
    restart: unless-stopped
    ports:
      - 8080:8080
    env_file: .env
    environment:
      - RUNNING_ENV=docker
      # If backend is running in docker, then we access the database in docker between dockers
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/rolling-board-bootstrap-db
    depends_on:
      database:
        condition: service_healthy
        restart: true
    volumes:
      - .:/app
      - /app/node_modules

  database:
    image: postgres:17
    container_name: ${APP_NAME}-db
    restart: always
    ports:
      - 5432:5432
    logging:
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=${APP_NAME}-db
    volumes:
      - ~/apps/postgres/${APP_NAME}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      timeout: 10s
